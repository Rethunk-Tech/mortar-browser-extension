<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mortar</title>
    <style>
      :root {
        color-scheme: dark;
        font: 14px sans-serif;
      }

      body {
        background: rgb(36 35 31);
        color: rgb(244 240 232);
        margin: 0;
        min-width: 190px;
        padding: 14px;
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
      }

      select {
        background: rgb(52 50 45);
        border: 1px solid rgb(113 106 91);
        border-radius: 4px;
        color: inherit;
        padding: 5px;
        width: 100%;
      }

      #popup-actions {
        display: flex;
        gap: 8px;
        margin: 10px 0 0;
      }
      #popup-actions button {
        background: rgb(52 50 45);
        border: 1px solid rgb(113 106 91);
        border-radius: 4px;
        color: inherit;
        cursor: pointer;
        flex: 1;
        padding: 5px;
      }
      #status {
        color: rgb(196 188 172);
        font-size: 12px;
        line-height: 1.35;
        margin: 10px 0 0;
      }

      #updates-heading {
        border-bottom: 1px solid var(--accent, rgb(214 177 122));
        font-size: 14px;
        font-weight: 600;
        margin: 16px 0 8px;
        padding-bottom: 6px;
      }

      #updates {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      #updates li {
        margin: 0 0 8px;
      }

      #updates a {
        color: inherit;
        text-decoration: underline;
      }

      #updates-empty {
        color: rgb(196 188 172);
        font-size: 12px;
        line-height: 1.35;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <label for="mode">On Nexus pages</label>
    <select id="mode">
      <option value="off">Off (do not mark Nexus pages)</option>
      <option value="highlight">Highlight</option>
      <option value="hide">Hide mods already in Mortar</option>
    </select>
    <p id="status"></p>
    <p id="popup-actions">
      <button type="button" id="mortar-open-app">Open Mortar</button>
      <button type="button" id="mortar-check-now">Check now</button>
    </p>
    <h2 id="updates-heading">Updates</h2>
    <ul id="updates"></ul>
    <p id="updates-empty"></p>
    <script defer src="plural.js"></script>
    <script defer src="updates.js"></script>
    <script defer src="popup.js"></script>
    <script defer src="popupActions.js"></script>
  </body>
</html>
