<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mortar</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        width: 340px;
        padding: 14px;
      }

      h1 {
        font-size: 17px;
      }

      #status {
        margin: 10px 0 0;
        color: var(--dim);
        font-size: 13px;
      }

      #popup-actions {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        margin: 12px 0 0;
      }

      #popup-actions button {
        white-space: nowrap;
      }

      #updates-heading {
        margin: 16px 0 8px;
      }

      #updates {
        list-style: none;
        margin: 0;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }

      #updates:empty {
        display: none;
      }

      #updates li + li {
        border-top: 1px solid var(--line);
      }

      #updates a {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 10px;
        color: var(--ink);
        text-decoration: none;
      }

      #updates .source {
        flex: none;
        color: var(--faint);
        font-size: 12px;
      }

      #updates a:hover {
        background: var(--raised);
        color: var(--accent);
      }

      #updates-empty {
        margin: 0;
        color: var(--dim);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1 class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect x="6" y="12" width="24" height="11" rx="2" />
        <rect x="34" y="12" width="24" height="11" rx="2" />
        <rect x="6" y="27" width="10" height="11" rx="2" />
        <rect x="20" y="27" width="24" height="11" rx="2" />
        <rect x="48" y="27" width="10" height="11" rx="2" />
        <rect x="6" y="42" width="24" height="11" rx="2" />
        <rect x="34" y="42" width="24" height="11" rx="2" />
      </svg>
      Mortar
    </h1>
    <p id="status" role="status"></p>
    <p id="popup-actions">
      <button type="button" id="mortar-open-app">Open Mortar</button>
      <button type="button" id="mortar-check-now">Check now</button>
      <button type="button" id="mortar-options">Options</button>
    </p>
    <h2 id="updates-heading" class="kicker">Updates</h2>
    <ul id="updates"></ul>
    <p id="updates-empty"></p>
    <script defer src="plural.js"></script>
    <script defer src="updates.js"></script>
    <script defer src="popup.js"></script>
    <script defer src="popupActions.js"></script>
  </body>
</html>
