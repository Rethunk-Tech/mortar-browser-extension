name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Dependabot PRs are never merged (the bump is applied by hand on main, where this runs), so CI on them is spent minutes.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: Rethunk-Tech/gh-actions/setup-bun@bc5fa5b1004205c9c9399fc941d79d5ada53c59b # v1.16

      - name: Lint
        if: ${{ !cancelled() }}
        run: bun run lint

      - name: Test
        if: ${{ !cancelled() }}
        run: bun run test

      - name: Web-ext
        if: ${{ !cancelled() }}
        run: bun run webext
