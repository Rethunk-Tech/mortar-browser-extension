name: Release

# A v* tag builds the extension zip, a Chrome Web Store zip and, when the AMO secrets are set, an unlisted signed
# Firefox add-on with its updates.json, and attaches all of them to the tag's release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A release run is never cancelled part-way; a second tag push queues behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # AMO's review of an unlisted version usually takes minutes, and signing waits for it.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: Rethunk-Tech/gh-actions/setup-bun@79cf1f780ce44c714a6928098da557539eba150f # v1.20
        with:
          run-test: "true"

      - name: Lint
        if: ${{ !cancelled() }}
        run: bun run lint

      - name: Web-ext
        if: ${{ !cancelled() }}
        run: bun run webext

      - name: Tag matches manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version manifest.json)"
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match manifest.json version $version" >&2
            exit 1
          fi

      - name: Zips
        run: bun run build

      # AMO signs each extension version once, so a rerun reuses the signed copy from the release or, when the release
      # never got it, from AMO itself. This job cannot create a release; it only reads an existing one.
      - name: Firefox add-on
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::notice::AMO_JWT_ISSUER or AMO_JWT_SECRET is not set; the release has no signed Firefox add-on"
            exit 0
          fi
          xpi=dist/mortar-browser-extension.xpi
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p mortar-browser-extension.xpi -D dist 2>/dev/null; then
            exit 0
          fi
          bun scripts/amo-signed.mjs "$(jq -r .browser_specific_settings.gecko.id manifest.json)" "${TAG#v}" "$xpi"
          if [ ! -f "$xpi" ]; then
            bunx web-ext@10.8.0 sign --source-dir dist/firefox --channel unlisted --artifacts-dir "$RUNNER_TEMP/xpi"
            mv "$RUNNER_TEMP"/xpi/*.xpi "$xpi"
          fi

      # The add-on is distributed outside AMO, so Firefox updates it from the manifest's update_url: the latest
      # release's updates.json, naming this release's .xpi and its hash.
      - name: Firefox update manifest
        if: hashFiles('dist/mortar-browser-extension.xpi') != ''
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          jq -n \
            --arg id "$(jq -r .browser_specific_settings.gecko.id manifest.json)" \
            --arg version "${TAG#v}" \
            --arg link "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/mortar-browser-extension.xpi" \
            --arg hash "sha256:$(sha256sum dist/mortar-browser-extension.xpi | cut -d' ' -f1)" \
            '{addons: {($id): {updates: [{version: $version, update_link: $link, update_hash: $hash}]}}}' >dist/updates.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/*.zip
            dist/*.xpi
            dist/updates.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files=(dist/*.zip)
          if [ -f dist/mortar-browser-extension.xpi ]; then
            files+=(dist/mortar-browser-extension.xpi dist/updates.json)
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes --latest "${files[@]}"
          fi
