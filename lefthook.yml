pre-commit:
  jobs:
    - name: gitleaks
      run: gitleaks git --pre-commit --staged --redact --no-banner --log-level warn
pre-push:
  jobs:
    - name: gate
      # A push from a worktree hands hooks GIT_DIR; a test running git in a temp repo would then rewrite this clone.
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_COMMON_DIR bun run gate
